{% extends 'base.html' %}

{% block title %}공지사항 등록 | Django Auth{% endblock %}

{% block content %}
<div class="card auth-card shadow-lg border-0">
    <div class="auth-header text-center">
        <div class="auth-icon"><i class="bi bi-pencil-square"></i></div>
        <h3 class="mb-1">공지사항 등록</h3>
        <p class="mb-0 opacity-75">제목과 내용을 입력하세요.</p>
    </div>

    <div class="card-body p-4 p-md-5">
        <form method="post">
            {% csrf_token %}
            <div class="mb-3">
                <label for="title" class="form-label fw-semibold">제목</label>
                <input type="text" class="form-control" id="title" name="title" required>
            </div>
            <div class="mb-3">
                <label for="content" class="form-label fw-semibold">내용</label>
                <textarea class="form-control" id="content" name="content" rows="6" required></textarea>
            </div>
            <div class="d-flex justify-content-end gap-2">
                <a href="{% url 'notice_list' %}" class="btn btn-outline-secondary">취소</a>
                <button type="submit" class="btn btn-primary">등록</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
