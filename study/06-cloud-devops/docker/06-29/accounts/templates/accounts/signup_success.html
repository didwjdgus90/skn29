{% extends 'base.html' %}

{% block title %}회원가입 완료 | Django Auth{% endblock %}

{% block content %}
<div class="card auth-card shadow-lg border-0 text-center">
    <div class="success-header">
        <div class="success-icon"><i class="bi bi-check-circle-fill"></i></div>
        <h3 class="mb-1">회원가입 완료</h3>
        <p class="mb-0 opacity-75">계정 생성이 정상적으로 완료되었습니다.</p>
    </div>
    <div class="card-body p-4 p-md-5">
        <h4 class="fw-bold mb-3">이제 로그인할 수 있습니다.</h4>
        <p class="text-muted mb-4">로그인 후 마이페이지, 세션 정보, 공지사항 기능을 이용해보세요.</p>
        <div class="d-grid gap-2">
            <a href="{% url 'login' %}" class="btn btn-success py-2">
                <i class="bi bi-box-arrow-in-right me-1"></i>로그인하기
            </a>
            <a href="{% url 'home' %}" class="btn btn-outline-secondary py-2">
                <i class="bi bi-house me-1"></i>메인으로 이동
            </a>
        </div>
    </div>
</div>
{% endblock %}
